name: build-windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DMXU_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render the five screens (UI check)
        shell: pwsh
        continue-on-error: true
        env:
          QT_QUICK_BACKEND: software
        run: |
          New-Item -ItemType Directory -Force -Path ui-shots | Out-Null
          $p = Start-Process -FilePath "build/Release/MxuSlides.exe" `
            -ArgumentList "--screenshots","ui-shots" -PassThru -Wait
          Write-Host "exit code: $($p.ExitCode)"
          Get-ChildItem ui-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProSlides-UI-screenshots
          path: ui-shots/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: MxuSlides-Windows
          path: build/Release/
